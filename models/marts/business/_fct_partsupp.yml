version: 2

models:
  - name: fct_partsupp
    description: Fact table con la combinación de cada pieza y su proveedor.
    columns:
      - name: partsupp_key
        description: Surrogate primary key.
        tests:
          - unique
          - not_null
      - name: partsupp_part_key
        description: Foreign key. Pieza del registro.
        tests:
          - not_null
          - relationships:
              to: ref('dim_part')
              field: part_key

      - name: partsupp_supplier_key
        description: Foreign key. Proveedor de la pieza.
        tests:
          - not_null
          - relationships:
              to: ref('dim_supplier')
              field: supplier_key
      - name: partsupp_available_quantity
        description: Stock disponible de la piza desde dicho proveedor.
        tests:
          - not_null

      - name: partsupp_supply_cost
        description: Coste de la pieza desde dicho proveedor.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_of_type:
              column_type: number
      
      - name: part_name
        description: Nombre de la pieza.

      - name: supplier_nation
        description: Pais del proveedor.

      - name: partsupp_comments
        description: Comentarios adicionales sobre la relación Proveedor-Pieza.